# A股交易系统 nginx 站点配置
# 部署脚本会将其复制到 /etc/nginx/sites-available/trading 并软链到 sites-enabled

server {
    listen 80;
    server_name __SERVER_IP__;

    # 前端静态文件（React SPA 构建产物）
    root __APP_DIR__/frontend/dist;
    index index.html;

    # SPA 路由 fallback（刷新 / 深层路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        access_log off;
    }
}